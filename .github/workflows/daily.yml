name: daily-episode

on:
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC every day
  workflow_dispatch: {}

jobs:
  episode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the studio box (ffmpeg+libass, Kokoro, Whisper, Wav2Lip), with layer cache.
      - name: Build studio box
        uses: docker/build-push-action@v6
        with:
          context: .
          file: box/Dockerfile
          load: true
          tags: ai-shorts-studio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Persist rendered episodes so each day renders the NEXT one in the season.
      - name: Restore build
        uses: actions/cache/restore@v4
        with:
          path: build
          key: build-${{ github.run_id }}
          restore-keys: build-

      - name: Render next episode
        run: |
          docker run --rm \
            -v "$PWD/content:/studio/content" \
            -v "$PWD/build:/studio/build" \
            ai-shorts-studio:latest \
            sh -c "node scripts/generate.mjs && node scripts/render.mjs && node scripts/dashboard.mjs"

      - name: Save build
        uses: actions/cache/save@v4
        with:
          path: build
          key: build-${{ github.run_id }}

      - name: Upload episode
        uses: actions/upload-artifact@v4
        with:
          name: episode
          path: build/**/episode.mp4

      - name: Publish
        if: ${{ vars.PUBLISH == 'true' }}
        run: |
          docker run --rm \
            -v "$PWD/content:/studio/content" \
            -v "$PWD/build:/studio/build" \
            -e PUBLISH=true \
            -e POSTIZ_URL -e POSTIZ_API_KEY -e IG_ACCESS_TOKEN -e IG_USER_ID -e MEDIA_URL_BASE \
            ai-shorts-studio:latest node scripts/publish.mjs
        env:
          POSTIZ_URL: ${{ secrets.POSTIZ_URL }}
          POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MEDIA_URL_BASE: ${{ vars.MEDIA_URL_BASE }}
