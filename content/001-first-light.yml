# ~70 words renders to about 28 seconds at a calm pace.
script: |
  Nobody told me this, so I'll tell you.
  I spent my twenties waiting for permission.
  A manager, a mentor, a sign — someone to say "you're ready now."
  It never came. It never comes.
  The day I stopped waiting was the day things started moving.
  Not because I was ready — because I decided.
  You don't get certainty first. You get it after.
  So if you're waiting for a green light, look down.
  You're holding it.

